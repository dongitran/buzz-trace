[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buzz-trace"
version = "0.1.0"
description = "Distributed Thread Observability & Diagnostic CLI for Multi-Agent Nostr Networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Đông Trần", email = "dongitran@users.noreply.github.com" }
]
keywords = ["observability", "telemetry", "opentelemetry", "arize-phoenix", "nostr", "multi-agent", "llm-traces"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
buzz-trace = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
